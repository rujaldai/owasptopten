spring:
  application:
    name: owasp top 10
  datasource:
    url: jdbc:mysql://localhost:3306/owasptopten
    username: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    minIdle: 5
    maxPoolSize: 10
    idleTimeout: 30000
    max-lifetime: 1800000
    connection-timeout: 30000
    auto-commit:  true
  jpa:
    hibernate:
      ddl-auto: update

management:
  endpoints:
    web:
      exposure:
        include: '*'
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    metrics:
      access: READ_ONLY
    prometheus:
      access: READ_ONLY
    env:
      show-values: ALWAYS
  info:
    env:
      enabled: true

server:
  port: 8081

# Application-specific security configurations
app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:8080,http://localhost:8081
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
    allowed-headers: authorization,content-type,x-csrf-token,x-requested-with
    exposed-headers: x-csrf-token
    allow-credentials: true
    max-age: 3600
  
  rate-limit:
    requests-per-minute: 100
    login-requests-per-minute: 5

# Logging configuration for security events
logging:
  level:
    com.owasptopten.secure.security: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/security.log
    max-size: 10MB
    max-history: 30